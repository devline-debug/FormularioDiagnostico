<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="50%" style="stop-color:#D4A843"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  <!-- Safe zone: content centered in inner 75% (safe area for maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="0" y="498" width="512" height="14" fill="url(#gold)"/>
  <!-- Icon content sits well within safe zone -->
  <text x="256" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="240" font-weight="700"
        text-anchor="middle" fill="url(#gold)" letter-spacing="-5">SL</text>
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="30" font-weight="300"
        text-anchor="middle" fill="rgba(255,255,255,0.45)" letter-spacing="12">Studio Louis</text>
</svg>
